<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Pacarku Tercinta ❤️</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        h1 { color: #ff4d6d; }
        p { color: #4a4a4a; font-size: 18px; line-height: 1.6; }
        .heart { font-size: 50px; animation: heartbeat 1.2s infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.1); }
            40% { transform: scale(1.05); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="heart">❤️</div>
        <h1>Halo Sayang!</h1>
        <p>Aku cuma mau bilang terima kasih ya sudah selalu ada di samping aku. Website ini khusus aku bikin buat kamu sebagai bukti kalau aku selalu mikirin kamu hoho. i love you, baby! </p>
    </div>

</body>
</html>
